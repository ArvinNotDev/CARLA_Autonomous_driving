name: GUI smoke tests

on:
  push:
    branches:
      - feature/yolo26s-sem-integration
    paths:
      - "ui/**"
      - "stream.py"
      - "runtime_settings.py"
      - "config_city.py"
      - "runtime_profiles.json"
      - "main.py"
      - "vision/**"
      - "tests/test_panel.py"
      - "tests/test_drivable_area_debugger.py"
      - ".github/workflows/gui-smoke-tests.yml"
  pull_request:
    branches:
      - feature/yolo26s-sem-integration

jobs:
  gui-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Install GUI test dependencies
        run: python -m pip install numpy pytest PySide6 opencv-python-headless
      - name: Compile GUI modules
        run: python -m compileall -q ui stream.py runtime_settings.py main.py vision
      - name: Run GUI smoke tests
        run: python -m pytest -q tests/test_panel.py tests/test_drivable_area_debugger.py
