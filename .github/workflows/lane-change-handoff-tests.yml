name: Lane-change steering handoff tests

on:
  push:
    branches:
      - feature/yolo26s-sem-integration
    paths:
      - "navigation/lane_change_manager.py"
      - "driving/auto_driver.py"
      - "tests/test_lane_change_control_handoff.py"
      - ".github/workflows/lane-change-handoff-tests.yml"
  pull_request:
    branches:
      - feature/yolo26s-sem-integration

jobs:
  lane-change-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install numpy pytest
      - name: Test lane-change steering ownership
        run: python -m pytest -q tests/test_lane_change_control_handoff.py
